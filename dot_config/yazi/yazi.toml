# from https://qiita.com/dai_chi/items/c6590a2ca91c132afdf8
# Yazi設定ファイル
# レイアウト設定
# ratio = [親ディレクトリ, カレント, プレビュー]
# 親を0にすると非表示（VSCode風の2カラムレイアウト）
[mgr]
ratio = [0, 1, 2]
show_hidden = true

[opener]
edit = [
  { run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
  { run = 'zed --wait "$@"', desc = "Zed", for = "unix" },
]
