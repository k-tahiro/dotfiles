{{- /* chezmoi:modify-template */ -}}
{{- $config := fromToml (default "" .chezmoi.stdin) -}}
{{- $servers := (.mcp.shared | default dict) -}}
{{- if .isWork -}}
{{-   $servers = mergeOverwrite $servers (.mcp.work | default dict) -}}
{{- else -}}
{{-   $servers = mergeOverwrite $servers (.mcp.private | default dict) -}}
{{- end -}}
{{- with (get $servers "serena") -}}
  {{- $args := concat (.args | default list) (list "codex") -}}
  {{- $servers = mergeOverwrite $servers (dict "serena" (mergeOverwrite . (dict "args" $args))) -}}
{{- end -}}
{{- $config = mergeOverwrite $config (dict "mcp_servers" $servers) -}}
{{- $config = mergeOverwrite $config (dict "project_doc_fallback_filenames" (list "CLAUDE.md")) -}}
{{- $config | toToml -}}
